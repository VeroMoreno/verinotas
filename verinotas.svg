<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a52"/>
      <stop offset="0.55" stop-color="#1a1230"/>
      <stop offset="1" stop-color="#140f22"/>
    </linearGradient>
    <radialGradient id="morado" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#ff6f7d" stop-opacity="0.75"/>
