  <rect width="512" height="512" fill="url(#fondo)"/>
  <rect width="512" height="512" fill="url(#morado)"/>
  <rect width="512" height="512" fill="url(#coral)"/>
  <rect width="512" height="512" fill="url(#agua)"/>
  <circle cx="238" cy="270" r="200" fill="url(#halo)"/>
  <!-- Estrella grande de cuatro puntas, con las curvas hacia dentro -->
  <path d="M238 96 C252 210 262 240 382 270 C262 300 252 330 238 444 C224 330 214 300 94 270 C214 240 224 210 238 96 Z" fill="url(#estrella)"/>
  <!-- Estrellita turquesa -->
  <path d="M378 104 C383 140 388 146 420 152 C388 158 383 164 378 200 C373 164 368 158 336 152 C368 146 373 140 378 104 Z" fill="url(#peque)"/>
  <!-- Puntitos -->
  <circle cx="130" cy="130" r="7" fill="#ffffff" opacity="0.8"/>
  <circle cx="405" cy="395" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="100" cy="410" r="4" fill="#ffffff" opacity="0.5"/>
